version: "3"

services:
  httpd:
    image: nginx:alpine
    security_opt:
      - no-new-privileges:true
    # nginx:alpine writes only its temp paths and pid/lock file
    # (nginx -V: /var/cache/nginx/*, /run/nginx.pid, /run/nginx.lock)
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
    volumes:
      - html:/usr/share/nginx/html:ro
      # the image's default.conf plus the IPv6 listener, which its entrypoint
      # script can no longer add to a read-only filesystem
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    ports:
    - "80:80"

  app:
    build: .
    image: netresearch/jira-export
    security_opt:
      - no-new-privileges:true
    # export-html.php writes only to $export_dir (www/, the html volume)
    read_only: true
    volumes:
      - html:/opt/jira-export/www

  build:
    build: ./build/
    volumes:
      - .:/srv/www

volumes:
  html: